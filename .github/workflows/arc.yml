name: AryaOS README Kernel

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '15 20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  rebuild-readme-kernel:
    runs-on: ubuntu-latest

    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GITHUB_USERNAME: ${{ secrets.USERNAME }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Rebuild SVG kernel
        run: npm start

      - name: Commit and push dist artifacts
        run: |
          git config --global user.email "${{ secrets.EMAIL }}"
          git config --global user.name "${{ secrets.NAME }}"

          git add dist/

          if ! git diff --cached --quiet; then
            git commit -m "🤖 AryaOS: auto-sync README kernel"
            git remote set-url origin https://${{ secrets.ACCESS_TOKEN }}@github.com/${{ github.repository }}
            git push origin main
          else
            echo "✅ Kernel already up to date."
          fi
