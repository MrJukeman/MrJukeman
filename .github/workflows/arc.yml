name: AryaOS README Kernel

on:
  schedule:
    - cron: '15 20 * * *'  # Daily at 2:00 AM NPT (UTC 20:15)
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  rebuild-readme-kernel:
    runs-on: ubuntu-latest

    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_ACCESS_TOKEN || github.token }}
      GITHUB_USERNAME: ${{ secrets.USERNAME || secrets.GITHUB_USERNAME || github.repository_owner }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      STEAM_VANITY_URL: ${{ secrets.STEAM_VANITY_URL || 'MrJukeman' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Rebuild SVG kernel
        run: npm start

      - name: Commit and push dist artifacts
        run: |
          git config --global user.email "${{ secrets.EMAIL }}"
          git config --global user.name "${{ secrets.NAME }}"

          git add dist/

          if ! git diff --cached --quiet; then
            git commit -m "🤖 AryaOS: auto-sync README kernel [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.ACCESS_TOKEN || secrets.GITHUB_ACCESS_TOKEN || github.token }}@github.com/${{ github.repository }}
            git push origin main
          else
            echo "✅ Kernel already up to date."
          fi
