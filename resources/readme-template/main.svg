<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="540" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
  <title>{svg_title}</title>
  <style>{css}</style>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <linearGradient id="header-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="{accent_a}" stop-opacity="0.35" />
      <stop offset="100%" stop-color="{accent_b}" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="1000" height="540" class="main-box" rx="16" />
  <rect width="1000" height="540" fill="url(#grid)" rx="16" />
  <rect x="1" y="1" width="998" height="88" fill="url(#header-glow)" rx="15" />

  {butterflies_back}

  {panels}

  {bottom_panels}

  <text x="28" y="528" class="footer">{footer}</text>

  {butterflies_front}
</svg>
