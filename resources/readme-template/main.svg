<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="{svg_height}" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"><title>{svg_title}</title><style>{css}</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255,255,255,{grid_opacity})" stroke-width="1" d="M 24 0 L 0 0 0 24"/></pattern>{wallpaper_gradient}<filter id="crew-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="1.1"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="{svg_height}" class="main-box" rx="16"/><rect width="1000" height="{svg_height}" fill="url(#grid)" rx="16"/>{wallpaper_overlay} {butterfly_trails} {butterflies_back} {panels} {bottom_panels}<text x="28" y="{footer_y}" class="footer">{footer}</text>{butterflies_front}</svg>
